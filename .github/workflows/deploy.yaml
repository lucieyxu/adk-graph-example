name: Build and Deploy

on:
  push:
    branches:
      - staging
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Mise
        uses: jdx/mise-action@v2

      - name: Install Dependencies
        run: |
          mise run trust-recursive
          # Sync shared and template packages to prepare linting env
          mise run packages-shared
          mise run packages-agents-template
          mise run packages-services-mcp-template

      - name: Run Linting
        run: mise run lint

      - name: Run Automated Tests
        run: mise run test

  deploy_agents_and_services:
    needs: lint_and_test
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ (github.ref == 'refs/heads/prod' || github.event.inputs.environment == 'prod') && vars.PROD_GCP_PROJECT_ID || vars.STAGING_GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION || 'us-central1' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ (github.ref == 'refs/heads/prod' || github.event.inputs.environment == 'prod') && secrets.PROD_WORKLOAD_IDENTITY_PROVIDER || secrets.STAGING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ (github.ref == 'refs/heads/prod' || github.event.inputs.environment == 'prod') && secrets.PROD_SERVICE_ACCOUNT || secrets.STAGING_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Mise (Python, uv, Node)
        uses: jdx/mise-action@v2

      - name: Run Standalone Agent Evaluations
        run: |
          # Loop through each custom agent and run evaluations before deploying
          for agent_dir in agents/*/; do
            agent_name=$(basename "$agent_dir")
            if [ "$agent_name" != "__template_agent_py__" ] && [ -f "${agent_dir}eval.py" ]; then
              echo "Running local evaluations for Agent: $agent_name..."
              cd "$agent_dir"
              # Sync packages
              mise install && mise exec -- uv sync
              # Run eval
              GOOGLE_CLOUD_PROJECT="$GCP_PROJECT_ID" GOOGLE_CLOUD_LOCATION="$GCP_LOCATION" GOOGLE_GENAI_USE_VERTEXAI="1" mise exec -- uv run eval.py
              cd -
            fi
          done

      - name: Deploy Standalone Agents
        run: |
          # Loop through each folder in agents/ (excluding template) and run deploy.py
          for agent_dir in agents/*/; do
            agent_name=$(basename "$agent_dir")
            if [ "$agent_name" != "__template_agent_py__" ] && [ -f "${agent_dir}deploy.py" ]; then
              echo "Deploying Agent: $agent_name..."
              cd "$agent_dir"
              # Sync packages
              mise install && mise exec -- uv sync
              # Run deploy script
              GOOGLE_CLOUD_PROJECT="$GCP_PROJECT_ID" GOOGLE_CLOUD_LOCATION="$GCP_LOCATION" GOOGLE_GENAI_USE_VERTEXAI="1" mise exec -- uv run deploy.py
              cd -
            fi
          done

      - name: Deploy Cloud Run Services
        run: |
          # Loop through each folder in services/ (excluding templates) and deploy to Cloud Run
          for service_dir in services/*/; do
            service_name=$(basename "$service_dir")
            if [ "$service_name" != "__template_py__" ] && [ "$service_name" != "__template_ts__" ] && [ "$service_name" != "__template_mcp_py__" ]; then
              if [ -f "${service_dir}cloudrun.dockerfile" ]; then
                echo "Deploying Service: $service_name to Cloud Run..."
                gcloud run deploy "$service_name" \
                  --source="$service_dir" \
                  --port=8080 \
                  --region="$GCP_LOCATION" \
                  --project="$GCP_PROJECT_ID" \
                  --allow-unauthenticated
              fi
            fi
          done
