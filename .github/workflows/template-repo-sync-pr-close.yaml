name: Template Repo Sync - PR Close

on:
  pull_request:
    types: [closed]
    branches:
      - staging

env:
  TEMPLATE_OWNER: delta-fde
  TEMPLATE_REPOSITORY: template-agentic-starter-kit-agent
  GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_PAT }}

jobs:
  update-template-sha:
    if: github.event.pull_request.merged == true && github.repository != 'delta-fde/template-agentic-starter-kit-agent'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TEMPLATE_SYNC_PAT || github.token }}
          fetch-depth: 0

      - name: Verify Sync Token Configuration
        id: verify_token
        run: |
          if [ -z "${{ secrets.TEMPLATE_SYNC_PAT }}" ]; then
            echo "::warning::TEMPLATE_SYNC_PAT secret is not configured. Downstream template autosync is bypassed."
            echo "bypass=true" >> $GITHUB_OUTPUT
          else
            echo "bypass=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Branch and Update Variable LAST_SYNCED_TEMPLATE_SHA
        if: steps.verify_token.outputs.bypass != 'true'
        run: |
          MERGED_BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ "$MERGED_BRANCH" == template-repo-sync/* ]]; then
            echo "Merged branch: $MERGED_BRANCH"

            # PARSE commit sha from branch name
            EXTRACTED_SHA="${MERGED_BRANCH/template-repo-sync\//}"

            if [[ -z "$EXTRACTED_SHA" ]]; then
              echo "Error: Could not parse SHA from branch name."
              exit 1
            fi

            echo "Updating repository variable LAST_SYNCED_TEMPLATE_SHA to $EXTRACTED_SHA"
            
            gh variable set LAST_SYNCED_TEMPLATE_SHA --body "$EXTRACTED_SHA"
            
            echo "Success"
          fi
        shell: bash