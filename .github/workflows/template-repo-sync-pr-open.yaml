name: Template Repo Sync - PR Open

on:
  schedule:
    # Daily at 8am UTC, or midnight PST
    - cron:  "0 8 * * *"
  workflow_dispatch:

env:
  TEMPLATE_BRANCH: main
  TEMPLATE_OWNER: delta-fde
  TEMPLATE_REPOSITORY: template-agentic-starter-kit-agent
  GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_PAT }}

jobs:
  template-repo-sync-pr-open:
    if: github.repository != 'delta-fde/template-agentic-starter-kit-agent'
    runs-on: ubuntu-latest
      
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TEMPLATE_SYNC_PAT || github.token }}
          fetch-depth: 0

      - name: Verify Sync Token Configuration
        id: verify_token
        run: |
          if [ -z "${{ secrets.TEMPLATE_SYNC_PAT }}" ]; then
            echo "::warning::TEMPLATE_SYNC_PAT secret is not configured. Downstream template autosync is bypassed."
            echo "To enable autosync, generate a Personal Access Token (PAT) with repository scopes and add it as a secret named TEMPLATE_SYNC_PAT."
            echo "bypass=true" >> $GITHUB_OUTPUT
          else
            echo "bypass=false" >> $GITHUB_OUTPUT
          fi

      - name: Get latest commit SHA from template repo
        if: steps.verify_token.outputs.bypass != 'true'
        id: get_template_sha
        uses: nmbgeek/github-action-get-latest-commit@main
        with:
          owner: ${{ env.TEMPLATE_OWNER }}
          repo: ${{ env.TEMPLATE_REPOSITORY }}
          branch: ${{ env.TEMPLATE_BRANCH }}
          token: ${{ secrets.TEMPLATE_SYNC_PAT }}

      - name: Compare SHAs and Sync
        if: steps.verify_token.outputs.bypass != 'true'
        id: compare_shas_and_open_pr
        run: |
          TEMPLATE_SHA="${{ steps.get_template_sha.outputs.hash }}"
          PROJECT_SHA="${{ vars.LAST_SYNCED_TEMPLATE_SHA }}"
          
          echo "Template Head: $TEMPLATE_SHA"
          echo "Project Last Sync: $PROJECT_SHA"
          
          export GIT_EDITOR=true

          if [[ "$TEMPLATE_SHA" == "$PROJECT_SHA" ]]; then
            echo "Project repo up to date with template repo."
            exit 0
          else
                        
            git config --global user.email "gcdemos-support@google.com"
            git config --global user.name "gcdemos-support"

            NEW_BRANCH_NAME="template-repo-sync/${TEMPLATE_SHA}"

            # Check if the specific branch for this SHA already exists on the remote.
            if git ls-remote --exit-code --heads origin "$NEW_BRANCH_NAME" >/dev/null 2>&1; then
              echo "This branch and PR already exist. Exiting..."
              exit 0
            fi

            echo "Project repo needs updates from template repo."

            # Find open PRs made by this workflow and rename and then close them - the new PR supersedes them
            OLD_PRS=$(gh pr list \
              --state open \
              --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("template-repo-sync/")) | .number')
            for pr_num in $OLD_PRS; do
              echo "Found outdated, still-open PR with updates from the template repo: PR #$pr_num"
              # CHANGE the name of the pr so that the PR-Close workflow does not trigger
              old_pr_name=$(gh pr view "$pr_num" --json title --jq .title)
              new_pr_name="superceded-$old_pr_name"
              gh pr edit "$pr_num" --title "$new_pr_name"
              gh pr close "$pr_num" --delete-branch --comment "Closing: Superseded by newer template update ($TEMPLATE_SHA)."
            done

            echo "Adding template remote..."
            git remote add template_remote "https://${{ secrets.TEMPLATE_SYNC_PAT }}@github.com/${{ env.TEMPLATE_OWNER }}/${{ env.TEMPLATE_REPOSITORY }}.git"
            git fetch template_remote

            gh repo set-default "${{ github.repository }}"

            echo "Creating branch $NEW_BRANCH_NAME at $TEMPLATE_SHA..."
            git checkout -b "$NEW_BRANCH_NAME" "$TEMPLATE_SHA"

            echo "Starting Rebase: Applying commits from $PROJECT_SHA to $TEMPLATE_SHA onto staging..."
            
            CONFLICT_FILES_LIST=""
            git config set advice.mergeConflict false

            if git rebase --onto origin/staging "$PROJECT_SHA" "$NEW_BRANCH_NAME"; then
                echo "Rebase completed cleanly."
            else
                echo "Rebase encountered conflicts. Entering resolution loop..."
        
                # Loop while rebase is in progress
                while [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; do
                    
                    # Track files with conflicts
                    CURRENT_CONFLICTS=$(git diff --name-only --diff-filter=U)
                    while IFS= read -r filepath; do
                        if [[ -n "$filepath" ]] && ! echo "$CONFLICT_FILES_LIST" | grep -Fqx "$filepath"; then
                            CONFLICT_FILES_LIST+="$filepath"$'\n'
                        fi
                    done <<< "$CURRENT_CONFLICTS"

                    echo "Forcing commit of conflicts..."
                    git add -A
                    
                    # Try to continue
                    if ! git rebase --continue; then
                        echo "Rebase continue returned non-zero (conflict on next commit OR empty commit)."
                        
                        # Check if we need to SKIP
                        if git diff --quiet && git diff --cached --quiet; then
                            echo "Working tree is clean. Commit was likely empty/duplicate. Skipping..."
                            git rebase --skip || true
                        else
                            echo "Conflicts detected in the next commit. Looping to resolve..."
                        fi
                    fi
                done
                
                echo "Rebase resolution loop complete."
            fi

            echo "Pushing branch..."
            git push origin "$NEW_BRANCH_NAME"

            echo "Creating Pull Request..."
            PR_BODY="This PR syncs changes from the template repository up to commit $TEMPLATE_SHA."
            PR_EXTRA_ARGS=""
            if [[ -n "$CONFLICT_FILES_LIST" ]]; then
              PR_EXTRA_ARGS="--draft"
              PR_BODY="${PR_BODY}\n\n### ⚠️ Merge Conflicts Detected\nThe following files contain conflict markers (\`<<<<\`) and require manual resolution:\n"
              SORTED_CONFLICTS=$(echo "$CONFLICT_FILES_LIST" | sort | sed '/^$/d')
              while IFS= read -r filepath; do
                PR_BODY="${PR_BODY}- [ ] \`$filepath\`\n"
              done <<< "$SORTED_CONFLICTS"
            fi

            gh pr create \
              --title "Template Update: ($TEMPLATE_SHA)" \
              --body "$(printf "$PR_BODY")" \
              --base staging \
              --head "$NEW_BRANCH_NAME" \
              --reviewer blakerutledge-g
            
            echo "Success"
          fi
        shell: bash