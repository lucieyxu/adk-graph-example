repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        exclude: ^helm-chart/.*/templates/.*\.yaml$
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
    -   id: ruff
        args: [ --fix ]
    -   id: ruff-format
-   repo: local
    hooks:
    -   id: mypy
        name: mypy
        entry: uv run mypy --python-executable .venv/bin/python .
        language: system
        pass_filenames: false
        types: [python]
