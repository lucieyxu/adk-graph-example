steps:
- name: 'python:bullseye'
  id: Python dependencies
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      # CONVERT pyproject.toml to requirements.txt
      pip install toml-to-requirements --root-user-action ignore

      # COPY shared dir to app folder, only moving .py and .json files
      mkdir -p "$_APP_DIR/backend/src/shared"
      EXTENSIONS=("json" "py" "toml")
      for ext in "${EXTENSIONS[@]}"; do
          find "./shared" -type f -iname "*.$ext" -exec cp --parents {} "$_APP_DIR/backend/src" \;
      done
      echo "Copied .toml, .py and .json files in /shared to $_APP_DIR/backend/src/shared"

      cd $_APP_DIR
      toml-to-req --toml-file backend/pyproject.toml

      cd backend/src/shared
      toml-to-req --toml-file pyproject.toml

      cd ../../..

      # MERGE two requirements.txt files
      echo "" >> requirements.txt
      cat backend/src/shared/requirements.txt >> requirements.txt

      # REMOVE references to local "shared" module
      sed -i "/shared/d" requirements.txt

      echo "Converted pyproject.toml to requirements.txt, merging this app and /shared"
      echo "-r ../requirements.txt" > backend/requirements.txt
      echo "Created nested requirements.txt reference app root level requirements.txt file"

- name: 'oven/bun:1.3.4'
  id: Build
  env:
    - 'ENV=$BRANCH_NAME'
    - 'NEXT_PUBLIC_ENV=$BRANCH_NAME'
    - 'NEXT_PUBLIC_GA_TAG_ID=__NEXT_PUBLIC_GA_TAG_ID__'
    - 'NEXT_PUBLIC_GCP_PROJECT_ID=$_GCP_PROJECT_ID'
    - 'GCP_PROJECT_NUMBER=$_GCP_PROJECT_NUMBER'
    - 'GCP_SERVICE_ACCOUNT=$_APP_SERVICE_ACCOUNT'
  entrypoint: 'bash'
  args:
    - -c
    - |
      cd $_APP_DIR
      cd frontend
      bun install
      bun run build
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: Deploy
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      cd $_APP_DIR
      sed -i -e "s/__SERVICE_NAME__/$_SERVICE_NAME/g" -e "s/__ENV__/$BRANCH_NAME/g" -e "s/__APP_SERVICE_ACCOUNT__/$_APP_SERVICE_ACCOUNT/g" -e "s/__GCP_PROJECT_NUMBER__/$_GCP_PROJECT_NUMBER/g" -e "s/__GCP_PROJECT_ID__/$_GCP_PROJECT_ID/g" app.yaml
      gcloud config set gcloudignore/enabled true
      echo $(gcloud meta list-files-for-upload)
      gcloud app deploy --service-account=$_APP_SERVICE_ACCOUNT --version="$_SERVICE_NAME-$COMMIT_SHA"
      sleep 15
      gcloud app versions list --service="$_SERVICE_NAME" --format="value(version.id)" --sort-by="~version.createTime" | tail -n +2 | xargs -r gcloud app versions delete --quiet
options:
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true
tags:
  - $BRANCH_NAME-$_SERVICE_NAME