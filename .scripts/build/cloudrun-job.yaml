substitutions:
  _DEPLOY_REGION: us-central1
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _PLATFORM: managed
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '--build-arg'
      - 'ENV=$BRANCH_NAME'
      - '--no-cache'
      - '-t'
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$BRANCH_NAME-$_JOB_NAME:$COMMIT_SHA
      - '-f'
      - $_DOCKER_PATH/cloudrun.dockerfile
      - '.'
    id: Build
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - >-
        $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$BRANCH_NAME-$_JOB_NAME:$COMMIT_SHA
    id: Push
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: Deploy
    entrypoint: bash
    args:
      - -c
      - |
        # Initialize base arguments for the gcloud command
        gcloud_args=(
          "beta"
          "run"
          "jobs"
          "deploy"
          "$BRANCH_NAME-$_JOB_NAME"
          "--service-account=$_APP_SERVICE_ACCOUNT"
          "--image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$BRANCH_NAME-$_JOB_NAME:$COMMIT_SHA"
          "--labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID"
          "--region=$_DEPLOY_REGION"
          "--tasks=$_TASKS"
          "--task-timeout=$_TASK_TIMEOUT"
          "--max-retries=$_RETRIES"
          "--parallelism=$_PARALLELISM"
          "--cpu=$_CPU_COUNT"
          "--memory=$_MEMORY_LIMIT"
          "--set-env-vars"
          "ENV=$BRANCH_NAME,GCP_PROJECT_NUMBER=$_GCP_PROJECT_NUMBER,REVISION_ID=$REVISION_ID,JOB_NAME=$_JOB_NAME,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GCP_SERVICE_ACCOUNT=$_APP_SERVICE_ACCOUNT"
          "--quiet"
        )

        # ADD gpu flags if provided
        if [[ -n "$_GPU_COUNT" && "$_GPU_COUNT" != "0" ]]; then
          gcloud_args+=("--gpu=$_GPU_COUNT")
          gcloud_args+=("--no-gpu-zonal-redundancy")
        fi
        if [[ -n "$_GPU_TYPE" ]]; then
          gcloud_args+=("--gpu-type=$_GPU_TYPE")
        fi
        gcloud "${gcloud_args[@]}"
images:
  - >-
    $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$BRANCH_NAME-$_JOB_NAME:$COMMIT_SHA
options:
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true
  dynamicSubstitutions: true
tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - $BRANCH_NAME-$_JOB_NAME