substitutions:
  _HELLO: world
steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: Deploy
    entrypoint: bash
    args:
      - -c
      - |
        # Initialize base arguments for the gcloud command
        gcloud_args=(
          "workflows"
          "deploy"
          "$BRANCH_NAME-$_WORKFLOW_NAME"
          "--source=$_WORKFLOW_PATH"
          "--location=us-central1"
          "--service-account=$_APP_SERVICE_ACCOUNT"
          "--execution-history-level=execution-history-detailed"
          "--labels=commit-sha=$COMMIT_SHA"
          "--set-env-vars"
          "ENV=$BRANCH_NAME,WORKFLOW_NAME=$_WORKFLOW_NAME,GCP_PROJECT_ID=$_GCP_PROJECT_ID,GCP_PROJECT_NUMBER=$_GCP_PROJECT_NUMBER,GCP_SERVICE_ACCOUNT=$_APP_SERVICE_ACCOUNT,$_ENV_URLS"
          "--quiet"
        )

        echo "deploying workflow with id: $BRANCH_NAME-$_WORKFLOW_NAME"
        echo "cmd args: ${gcloud_args[@]}"

        gcloud "${gcloud_args[@]}"
options:
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true
  dynamicSubstitutions: true
tags:
  - $BRANCH_NAME-$_WORKFLOW_NAME