[project]
name = "template_agent_py"
version = "0.1.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.12.0",
    "google-genai>=1.56.0",
    "google-cloud-aiplatform[reasoningengine]>=1.70.0",
    "shared",
    "google-adk>=2.2.0",
    "google-agents-cli",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
requires-python = "~=3.13.0"

[project.optional-dependencies]
eval = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]


[tool.uv]
package = false

[tool.uv.sources]
shared = { path = "../../shared", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
