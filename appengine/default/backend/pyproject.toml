[project]
dependencies = [
    "gunicorn>=23",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "requests>=2.32.5",
    "pydantic>=2.12.3",
    "firebase-admin>=7.1.0",
    "shared",
]
name = "backend"
version = "0.1.0"
requires-python = "~=3.13.0"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.uv.sources]
shared = { path = "../../../shared", editable = true }
