name: Sync to Customer Repo

on:
  push:
    branches:
      - main # Customize to the branch you want to sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Sync to Customer Repository
        env:
          REMOTE_URL: "git@github.com:<customer-org>/<repo>.git" # Replace with target repo SSH URL
          BRANCH_PREFIX: "upstream" # Prefix to use on the target repo, or leave empty
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Add the target repository
          git remote add target "${REMOTE_URL}"
          
          # Fetch target to ensure we can force push safely if needed
          git fetch target || true
          
          # Extract current branch name from GitHub ref
          CURRENT_BRANCH=${GITHUB_REF#refs/heads/}
          
          # Determine the target branch name
          if [ -z "${BRANCH_PREFIX}" ]; then
            TARGET_BRANCH="${CURRENT_BRANCH}"
          else
            TARGET_BRANCH="${BRANCH_PREFIX}/${CURRENT_BRANCH}"
          fi
          
          echo "Syncing branch ${CURRENT_BRANCH} to ${TARGET_BRANCH}..."
          
          # One-way push to the customer repo (no reverse remote, ever)
          git push target HEAD:${TARGET_BRANCH} --force-with-lease
