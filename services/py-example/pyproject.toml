[project]
name = "fastapi-example"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "requests>=2.32.5",
    "pydantic>=2.12.3",
    "dydantic>=0.0.8",
    "firebase-admin>=7.1.0",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "shared",
]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.uv.sources]
shared = { path = "../../shared", editable = true }
