[project]
dependencies = [
    "google-auth>=2.45.0",
    "google-genai>=1.56.0",
    "google-cloud-datastore>=2.23.0",
    "requests>=2.32.5",
    "pydantic>=2.12.5",
    "firebase-admin>=7.1.0",
    "google-cloud-storage>=3.6.0",
    "google-cloud-run>=0.12.0",
    "google-cloud-workflows>=1.19.0",
    "flask>=3.1.2",
    "google-cloud-secret-manager>=2.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
name = "shared"
version = "0.1.0"
requires-python = "~=3.13.0"

[tool.setuptools]
package-dir = {"shared" = "."}
packages = [
    "shared.py",
    "shared.py.components",
    "shared.py.flask",
    "shared.types"
]

[tool.pytest.ini_options]
pythonpath = [".."]

[tool.ruff.lint]
select = ["E", "F", "W"]
