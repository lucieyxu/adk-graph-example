main:
  steps:

    # 
    # TODO actually ingest the runtime args ?
    # 

    - init:
        assign:
          - env_name: '${sys.get_env("ENV")}'
          - project_id: '${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}'
          - workflow_name: '${sys.get_env("WORKFLOW_NAME")}'

    - log_start:
        call: sys.log
        args:
          text: '${"Starting workflow: " + env_name + "-" + workflow_name }'

    - sequence:
        try:
          steps:

            - py_example:
                call: http.post
                args:
                  url: '${sys.get_env("servicesPyExample") + "/hello"}'
                  auth: { type: "OIDC" }
                  body:
                    name: "Bob"
                result: py_example_hello

            - ts_example:
                call: http.post
                args:
                  url: '${sys.get_env("servicesTsExample") + "/hello"}'
                  auth: { type: "OIDC" }
                  body:
                    name: "Sally"
                result: ts_example_hello

            - combine_output:
                assign:
                  - output:
                      service_py_example: ${py_example_hello.body}
                      service_ts_example: ${ts_example_hello.body}

        except:
          as: e
          steps:
            - log_error:
                call: sys.log
                args:
                  text: '${"Error caught: " + json.encode(e)}'
                  severity: "ERROR"
            - handle_error:
                return: '${"Workflow failed due to an error: " + e.message}'

    - final_return:
        return: ${output}